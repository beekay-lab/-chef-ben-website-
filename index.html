<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chef Ben | Professional Chef & Catering | Bee-Kay Urban Feast & Caterers</title>

    <meta name="description" content="Chef Ben of Bee-Kay Urban Feast & Caterers — professional pastry chef and caterer specialising in African, Continental and Indian cuisine, pastry, fine dining and professional catering.">
    <meta name="keywords" content="Chef Ben Kenya, Bee-Kay Urban Feast and Caterers, private chef Kenya, pastry chef Kenya, catering Kenya, fine dining Kenya, event catering Nairobi, professional chef Kenya">

    <meta property="og:title" content="Chef Ben | Culinary Excellence">
    <meta property="og:description" content="13 years of professional culinary experience across leading hospitality establishments in Kenya.">
    <meta property="og:image" content="images/WhatsApp%20Image%202026-09-29%20at%2020.18.57%20(1).jpeg">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("cbAiToggle");
    const box = document.getElementById("cbAiBox");
    const input = document.getElementById("cbAiInput");
    const send = document.getElementById("cbAiSend");
    const messages = document.getElementById("cbAiMsg");

    if (!toggle || !box) return;

    toggle.addEventListener("click", function () {
        box.style.display = box.style.display === "block" ? "none" : "block";
        if (box.style.display === "block" && input) input.focus();
    });

    function answer(q) {
        q = q.toLowerCase();
        if (q.includes("private chef")) return "Chef Ben offers private chef services for homes, Airbnb stays, private dinners and special occasions.";
        if (q.includes("catering") || q.includes("wedding") || q.includes("event")) return "Chef Ben provides catering for events, weddings, corporate functions and private occasions.";
        if (q.includes("book") || q.includes("booking")) return "Use the Book Chef Ben form on this website to send your enquiry directly to Chef Ben on WhatsApp.";
        if (q.includes("ktn") || q.includes("pika")) return "Chef Ben has been featured on KTN's Pika.";
        if (q.includes("price") || q.includes("cost")) return "For current pricing, please send a booking enquiry with your event details so Chef Ben can provide the appropriate quotation.";
        return "I can help with Chef Ben's private chef services, catering, bookings and KTN feature. Please ask me about one of these.";
    }

    if (send && input && messages) {
        send.addEventListener("click", function () {
            const q = input.value.trim();
            if (!q) return;
            messages.insertAdjacentHTML("beforeend", '<div class="cb-msg cb-user">' + q.replace(/</g,"&lt;").replace(/>/g,"&gt;") + '</div>');
            messages.insertAdjacentHTML("beforeend", '<div class="cb-msg cb-bot">' + answer(q) + '</div>');
            input.value = "";
            messages.scrollTop = messages.scrollHeight;
        });

        input.addEventListener("keydown", function (e) {
            if (e.key === "Enter") send.click();
        });
    }
});
</script><!-- CHEF BEN UPGRADE END --></body>
</html>
